<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#16395a"/>
      <stop offset="1" stop-color="#0a1520"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#5AB8F0" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AB8F0" stop-opacity="0"/>
      <stop offset="1" stop-color="#5AB8F0" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grid)"/>

  <!-- 1) yönetim paneli penceresi (temsili) -->
  <g transform="translate(60 180)">
    <rect width="300" height="210" rx="16" fill="#e9f6fd"/>
    <rect width="300" height="34" rx="16" fill="#1f4e73"/>
    <rect y="18" width="300" height="16" fill="#1f4e73"/>
    <circle cx="22" cy="17" r="6" fill="#ff7a90"/>
    <circle cx="42" cy="17" r="6" fill="#f5a524"/>
    <circle cx="62" cy="17" r="6" fill="#34d399"/>
    <rect x="12" y="46" width="70" height="152" rx="8" fill="#c9e6f6"/>
    <g fill="#7fb6d6">
      <rect x="22" y="60" width="50" height="10" rx="5"/>
      <rect x="22" y="80" width="40" height="10" rx="5"/>
      <rect x="22" y="100" width="50" height="10" rx="5"/>
      <rect x="22" y="120" width="34" height="10" rx="5"/>
      <rect x="22" y="140" width="46" height="10" rx="5"/>
    </g>
    <g fill="#b5d7ea">
      <rect x="96" y="50" width="190" height="22" rx="6"/>
      <rect x="96" y="82" width="190" height="16" rx="5"/>
      <rect x="96" y="106" width="190" height="16" rx="5"/>
      <rect x="96" y="130" width="190" height="16" rx="5"/>
      <rect x="96" y="154" width="120" height="16" rx="5"/>
    </g>
    <!-- tarayan çerçeve -->
    <g fill="none" stroke="#5AB8F0" stroke-width="6" stroke-linecap="round">
      <path d="M-14 22 V-14 H22"/>
      <path d="M278 -14 H314 V22"/>
      <path d="M314 188 V224 H278"/>
      <path d="M22 224 H-14 V188"/>
    </g>
    <rect x="-6" y="96" width="312" height="60" fill="url(#beam)"/>
    <rect x="-6" y="154" width="312" height="4" fill="#9fdcff"/>
  </g>

  <!-- 2) yapay zekâ adımı: kesik çizgili ok + ışıltı -->
  <path d="M330 410 C420 420 450 460 440 500" fill="none" stroke="#5AB8F0" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
  <path d="M424 488 L440 512 L458 492" fill="none" stroke="#5AB8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(470 418)" fill="#f5d84f">
    <path d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z"/>
    <path transform="translate(30 30) scale(0.45)" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z"/>
  </g>

  <!-- 3) çıkan Türkçe kılavuz: açık kitap -->
  <g transform="translate(300 600)">
    <path d="M0 -62 C-40 -88 -96 -92 -140 -80 V58 C-96 46 -40 50 0 76 Z" fill="#f2fbff"/>
    <path d="M0 -62 C40 -88 96 -92 140 -80 V58 C96 46 40 50 0 76 Z" fill="#dff2fc"/>
    <path d="M0 -62 V76" stroke="#0a1520" stroke-width="6" stroke-linecap="round"/>
    <path d="M-150 -76 V66 C-100 54 -40 58 0 86 C40 58 100 54 150 66 V-76" fill="none" stroke="#1f4e73" stroke-width="8" stroke-linejoin="round"/>
    <g stroke="#7fb6d6" stroke-width="7" stroke-linecap="round">
      <path d="M-120 -52 C-88 -60 -50 -58 -22 -46"/>
      <path d="M-120 -26 C-88 -34 -50 -32 -22 -20"/>
      <path d="M-120 0 C-88 -8 -50 -6 -22 6"/>
      <path d="M-120 26 C-88 18 -50 20 -22 32"/>
    </g>
    <!-- sağ sayfada küçük kalkan -->
    <path d="M70 -54 L104 -42 V-14 C104 8 90 22 70 30 C50 22 36 8 36 -14 V-42 Z" fill="#5AB8F0"/>
    <path d="M56 -12 L67 0 L86 -22" fill="none" stroke="#0a1520" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#7fb6d6" stroke-width="7" stroke-linecap="round">
      <path d="M30 48 C58 40 92 40 120 46"/>
    </g>
  </g>

  <!-- başlık -->
  <text x="300" y="112" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#5AB8F0" letter-spacing="2">ANTIKOR</text>
  <text x="300" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#9fcde8" letter-spacing="6">KILAVUZ OLUŞTURUCU</text>
  <text x="300" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#7fb6d6" letter-spacing="3">PANEL → YAPAY ZEKÂ → KILAVUZ</text>
</svg>
